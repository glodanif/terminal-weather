[package]
name = "terminal-weather"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde_json = { version = "1.0.149" }
serde = { version = "1.0.228", features = ["derive"] }
dirs = "6.0.0"
toml = "1.0.3"
clap = { version = "4.5.60", features = ["derive"] }
